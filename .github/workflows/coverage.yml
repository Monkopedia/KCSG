name: Coverage

on:
  pull_request:
  workflow_dispatch:

jobs:
  kover:
    runs-on: ubuntu-latest
    # Existing sample-test failures are pre-existing in this repository.
    # Keep this non-blocking until test stabilization and coverage gates are complete.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run coverage verification
        run: ./gradlew :kcsg:koverVerify :kcsg-dsl:koverVerify --stacktrace

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-reports
          path: |
            kcsg/build/reports/kover/
            kcsg-dsl/build/reports/kover/
