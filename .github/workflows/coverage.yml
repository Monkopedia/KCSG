name: Coverage

on:
  pull_request:
  workflow_dispatch:

jobs:
  library-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install OpenSCAD runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libglu1-mesa

      - name: Require public API checklist update when the public ABI changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          # Key the checklist requirement off the actual public ABI, not source paths.
          # The BCV dumps (kcsg/api, kcsg-dsl/api) change iff the public surface changes
          # (apiCheck, below, enforces that the dumps match the code). So a transparent
          # refactor that touches API-path source files but leaves the ABI byte-identical
          # no longer has to edit the checklist for no reason.
          API_CHANGES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            "kcsg/api/" "kcsg-dsl/api/")"

          if [ -n "$API_CHANGES" ]; then
            echo "Detected public ABI (BCV dump) changes:"
            echo "$API_CHANGES"
            CHECKLIST_CHANGE="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "docs/public-api-checklist.md")"
            if [ -z "$CHECKLIST_CHANGE" ]; then
              echo "docs/public-api-checklist.md must be updated when the public ABI changes."
              exit 1
            fi
          fi

      # The browser-execution gate is itself a gate, and a gate nobody has watched
      # fail cannot be distinguished from one that cannot fail. This feeds it
      # synthetic JUnit XML and requires it to go RED on an all-skipped suite, on
      # zero tests, and on a browser/node mismatch -- plus GREEN on a healthy one,
      # so "fails everything" cannot masquerade as working. Pure bash, ~1s.
      - name: Self-test the browser-execution gate
        run: ./scripts/ci/test_assert_browser_tests_ran.sh

      - name: Validate public ABI (binary-compatibility-validator)
        run: ./gradlew apiCheck --stacktrace

      # :csgs:test also compiles the CLI that ships as the csgs-all fat jar, and
      # :samples:build compiles the samples module; without them a compile break in
      # either JVM-only module passes PR CI.
      - name: Run module tests and coverage verification
        run: ./gradlew :kcsg:test :kcsg-dsl:test :kcsg:oracleTest :csgs:test :samples:build :kcsg:koverXmlReport :kcsg:koverVerifyJvm :kcsg-dsl:koverXmlReport :kcsg-dsl:koverVerify --stacktrace

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-reports
          path: |
            kcsg/build/reports/kover/
            kcsg-dsl/build/reports/kover/

      # Gradle prints "N tests completed" only on FAILURE, so a passing test task
      # prints no count at all and the console cannot distinguish 145 tests from
      # zero. These XML results carry <testsuite tests="N" skipped="M">, and the
      # number that proves a suite RAN something is tests minus skipped -- `tests`
      # on its own counts @Ignore'd cases, so an entirely skipped suite reports a
      # full, healthy N. Read both attributes or the count proves only collection.
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jvm
          path: |
            kcsg/build/test-results/
            kcsg-dsl/build/test-results/
            csgs/build/test-results/

  # Executes the commonTest suites on the non-JVM targets and JS environments a
  # Linux runner can run.
  # `:kcsg:test`/`:kcsg-dsl:test` are dependsOn(jvmTest), so without this job the
  # commonTest sources are compiled for these targets but never executed — the
  # library had an ABI gate on all 19 published coordinates per module and a
  # behaviour gate on exactly one. The test tasks depend on the corresponding
  # compileKotlin* tasks, so this strictly supersedes the previous compile-only smoke.
  #
  # Apple, mingw and linuxArm64 stay compile-and-ABI-only: their test binaries
  # cannot execute on a Linux runner. That is deliberate, not an oversight.
  #
  # Adding a macOS job would not close the Apple gap, and would look like it did.
  # KGP enables a native test task only when the target matches the host
  # (KotlinNativeHostTestRunFactory keys off `konanTarget.isCurrentHost`; the
  # simulator factory additionally requires a matching host architecture), and a
  # disabled Gradle task reports SKIPPED inside a green build. GitHub's macOS
  # runners are arm64, so of the 12 Apple targets published here only
  # macosArm64Test and the three *SimulatorArm64 test tasks would run;
  # macosX64Test, iosX64Test, tvosX64Test and watchosX64Test would silently skip,
  # and the four device targets (iosArm64, tvosArm64, watchosArm32, watchosArm64)
  # have no test task at all. Anyone adding that job must assert on the uploaded
  # test-results XML, not on the job going green.
  #
  # The js and wasm legs run each target in BOTH of its declared environments.
  # `browser()` is declared on js and wasmJs in both modules, and a browser is a
  # different JS environment from Node for the same published artifact — the
  # realistic browser-only failures are anything reaching for a Node API and the
  # kotlinx-io file paths, which a browser has no equivalent for. Karma fails soft
  # (see scripts/ci/assert_browser_tests_ran.sh), so the browser legs are gated on
  # an explicit executed-count assertion rather than on the exit status.
  multiplatform-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: js
            tasks: ":kcsg:jsNodeTest :kcsg-dsl:jsNodeTest :kcsg:jsBrowserTest :kcsg-dsl:jsBrowserTest"
            browserVariant: js
          - name: wasm
            tasks: ":kcsg:wasmJsNodeTest :kcsg:wasmWasiNodeTest :kcsg-dsl:wasmJsNodeTest :kcsg-dsl:wasmWasiNodeTest :kcsg:wasmJsBrowserTest :kcsg-dsl:wasmJsBrowserTest"
            browserVariant: wasmJs
          - name: native-linux
            tasks: ":kcsg:linuxX64Test :kcsg-dsl:linuxX64Test"
            browserVariant: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # karma-chrome-launcher resolves ChromeHeadless from CHROME_BIN first and
      # only then guesses at binary names. Resolving it here means the leg fails
      # with "no chrome" instead of with something further downstream, and it
      # documents the one variable a local reproduction needs (this box may have
      # `chromium` where the runner has `google-chrome`).
      - name: Resolve headless Chrome
        if: matrix.target.browserVariant != ''
        run: |
          for candidate in "$CHROME_BIN" google-chrome google-chrome-stable chromium chromium-browser; do
            [ -n "$candidate" ] || continue
            resolved="$(command -v "$candidate" || true)"
            if [ -n "$resolved" ]; then
              echo "CHROME_BIN=$resolved" >> "$GITHUB_ENV"
              "$resolved" --version || true
              exit 0
            fi
          done
          echo "No Chrome/Chromium binary found; the browser test legs cannot run."
          exit 1

      - name: Test ${{ matrix.target.name }} targets
        run: ./gradlew ${{ matrix.target.tasks }} --stacktrace

      # A green browser task is NOT evidence that it tested anything; see the
      # script's header. This reads <testsuite tests="N" skipped="M">, counts
      # tests-minus-skipped, and fails on 0 executed or on a browser/node
      # mismatch. scripts/ci/test_assert_browser_tests_ran.sh is its negative
      # control and runs in library-quality.
      - name: Assert ${{ matrix.target.name }} browser suites executed
        if: matrix.target.browserVariant != ''
        run: ./scripts/ci/assert_browser_tests_ran.sh ${{ matrix.target.browserVariant }}

      - name: Upload ${{ matrix.target.name }} test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.target.name }}
          path: |
            kcsg/build/test-results/
            kcsg-dsl/build/test-results/

  # Proves that somebody who RESOLVES the published artifacts can compile against them.
  # apiCheck validates the ABI's shape; it cannot see whether the types in that ABI reach a
  # consumer's compile classpath, which is a property of the published Gradle module
  # metadata. Nothing in this repo had ever resolved a publication before (issue #51).
  #
  # Its own job rather than part of `check`, because it costs a full publish plus a second
  # Gradle build. As a separate job it runs in parallel with library-quality, so it adds no
  # wall-clock to PR CI, its cost is attributable, and `./gradlew build` stays untouched for
  # contributors. Wiring it into `check` would put that cost on every local build for a
  # property that can only change when a dependency declaration changes.
  consumer-resolution-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve the published artifacts from standalone consumer builds
        run: ./scripts/consumer-smoke.sh
