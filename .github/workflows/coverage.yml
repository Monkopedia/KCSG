name: Coverage

on:
  pull_request:
  workflow_dispatch:

jobs:
  library-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require public API checklist update when API changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          API_CHANGES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            "kcsg/src/main/java/com/monkopedia/kcsg/*.kt" \
            "kcsg-dsl/src/main/java/com/monkopedia/kcsg/*.kt")"

          if [ -n "$API_CHANGES" ]; then
            echo "Detected public API file changes:"
            echo "$API_CHANGES"
            CHECKLIST_CHANGE="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "docs/public-api-checklist.md")"
            if [ -z "$CHECKLIST_CHANGE" ]; then
              echo "docs/public-api-checklist.md must be updated with public API changes."
              exit 1
            fi
          fi

      - name: Run library tests and coverage verification
        run: ./gradlew :kcsg:test :kcsg-dsl:test :kcsg:oracleTest :kcsg:koverXmlReport :kcsg:koverVerifyJvm :kcsg-dsl:koverXmlReport :kcsg-dsl:koverVerify --stacktrace

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-reports
          path: |
            kcsg/build/reports/kover/
            kcsg-dsl/build/reports/kover/

  multiplatform-compile-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: js
            tasks: ":kcsg:compileKotlinJs :kcsg-dsl:compileKotlinJs"
          - name: wasm
            tasks: ":kcsg:compileKotlinWasmJs :kcsg:compileKotlinWasmWasi :kcsg-dsl:compileKotlinWasmJs :kcsg-dsl:compileKotlinWasmWasi"
          - name: native-linux
            tasks: ":kcsg:compileKotlinLinuxX64 :kcsg-dsl:compileKotlinLinuxX64"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile ${{ matrix.target.name }} targets
        run: ./gradlew ${{ matrix.target.tasks }} --stacktrace
